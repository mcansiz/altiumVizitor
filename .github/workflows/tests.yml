# Ortak test işi: CI (her push) ve Release (etiket) bunu üç platformda çağırır.
# Şirket projeleri depoda olmadığından uçtan uca üretim testleri altium_monkey
# deposunun herkese açık örnek projelerini kullanır (tools/fetch_samples.py).
name: Testler

on:
  workflow_call:
    inputs:
      os:
        description: Runner (ubuntu-22.04, windows-2022, macos-14)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Testler (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      # CI'da eksik örnek / eksik node testi ATLATMAZ, düşürür.
      SCHVIZ_REQUIRE_SAMPLES: "1"
      SCHVIZ_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/constraints.txt

      - name: Qt çalışma kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Bağımlılıklar (sabit sürümler)
        run: python -m pip install --disable-pip-version-check -r requirements.txt -c .github/constraints.txt

      - name: Bağımlılık denetimi (deps.py)
        run: python deps.py

      - name: Örnek projeler
        run: python tools/fetch_samples.py

      - name: Testler
        run: python -m unittest discover -s tests -t . -v

      - name: Hata durumunda üretilen çıktılar
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-ciktilari-${{ inputs.os }}
          path: .tmp/test-out/
          if-no-files-found: ignore
          retention-days: 14
