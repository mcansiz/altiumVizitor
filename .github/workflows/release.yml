# Sürüm: `v*` etiketi push edilince üç platformda test + derleme + TASLAK
# release. Taslağı bir insan inceleyip (notları yazıp) yayınlar.
# Elle çalıştırma (workflow_dispatch) = deneme: her şey derlenir ve sınanır,
# dosyalar çalıştırmanın "Artifacts" bölümüne konur, release OLUŞTURULMAZ.
#
# Çıktılar:
#   SchematicViz-v<sürüm>-win-x64.exe            (önceki sürümlerle aynı ad)
#   SchematicViz-v<sürüm>-linux-x86_64.AppImage  (glibc 2.35+ / Ubuntu 22.04+)
#   SchematicViz-v<sürüm>-macos-arm64.zip        (deneysel, imzasız .app)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  SAMPLE: .tmp/samples/m2_emmc/proj/m2_emmc.PrjPcb

jobs:
  version:
    name: Sürüm denetimi
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: viewer.py
          sparse-checkout-cone-mode: false
      - id: v
        shell: bash
        run: |
          ver=$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' viewer.py)
          echo "APP_VERSION=$ver"
          if [ -z "$ver" ]; then echo "::error::viewer.py'de APP_VERSION yok"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) koddaki sürümle (v$ver) aynı değil"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: ubuntu-22.04 }
  test-windows:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: windows-2022 }
  test-macos:
    needs: version
    uses: ./.github/workflows/tests.yml
    with: { os: macos-14 }

  build-windows:
    name: Derleme (Windows exe)
    needs: [version, test-windows]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/constraints.txt
      - name: Bağımlılıklar + PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller -c .github/constraints.txt
      - name: Bağımlılık denetimi
        run: python deps.py
      - name: Exe
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean SchematicViz.spec
          mv dist/SchematicViz.exe "dist/SchematicViz-v$VER-win-x64.exe"
      - name: Deneme açılışı (self-test + üretim)
        shell: bash
        run: |
          python tools/fetch_samples.py
          python tools/smoke_launch.py "$VER" "$SAMPLE" "dist/SchematicViz-v$VER-win-x64.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/SchematicViz-v${{ env.VER }}-win-x64.exe
          if-no-files-found: error

  build-linux:
    name: Derleme (Linux AppImage)
    needs: [version, test-linux]
    # glibc tabanı = derleme makinesi. wn-geometer zaten glibc 2.35 istediği
    # için en eski uygun makine 22.04; daha yenisi eşiği gereksiz yükseltirdi.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/constraints.txt
      - name: Araçlar + Qt çalışma kütüphaneleri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends binutils file \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Bağımlılıklar + PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller -c .github/constraints.txt
      - name: Bağımlılık denetimi
        run: python deps.py
      - name: AppImage
        run: python tools/build_appimage.py
      - name: Deneme açılışı (self-test + üretim)
        run: |
          python tools/fetch_samples.py
          python tools/smoke_launch.py "$VER" "$SAMPLE" "dist/SchematicViz-v$VER-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: dist/SchematicViz-v${{ env.VER }}-linux-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Derleme (macOS .app, deneysel)
    needs: [version, test-macos]
    runs-on: macos-14
    timeout-minutes: 45
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/constraints.txt
      - name: Bağımlılıklar + PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller -c .github/constraints.txt
      - name: Bağımlılık denetimi
        run: python deps.py
      - name: .app
        run: |
          python -m PyInstaller --noconfirm --clean SchematicViz.spec
          ditto -c -k --keepParent dist/SchematicViz.app "dist/SchematicViz-v$VER-macos-arm64.zip"
      - name: Deneme açılışı (self-test + üretim)
        run: |
          python tools/fetch_samples.py
          python tools/smoke_launch.py "$VER" "$SAMPLE" dist/SchematicViz.app/Contents/MacOS/SchematicViz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist/SchematicViz-v${{ env.VER }}-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Taslak release
    # macOS deneyseldir: testi ya da derlemesi düşerse release yine oluşur,
    # yalnız macOS dosyası eklenmez. Windows ve Linux şarttır.
    needs: [version, build-linux, build-windows, build-macos]
    if: >-
      always() && github.ref_type == 'tag'
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - name: Taslak release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
          MACOS: ${{ needs.build-macos.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # Başlık konusu commit başlığından: "v2.32.1: konu" -> "konu"
          topic=$(git log -1 --format=%s | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+[^:]*:[[:space:]]*//')
          prev=$(gh release list --exclude-drafts -L 10 --json tagName -q '.[].tagName' \
                 | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          cd out
          sha256sum SchematicViz-* > SHA256SUMS
          cat SHA256SUMS
          python3 ../.github/release_notes.py "$VER" "$GITHUB_REF_NAME" "$prev" \
            "$GITHUB_REPOSITORY" "$RUN_URL" "$MACOS" > notes.md
          pre=""
          case "$VER" in *-*) pre="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release zaten var: dosyalar güncelleniyor"
            gh release upload "$GITHUB_REF_NAME" SchematicViz-* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" SchematicViz-* SHA256SUMS \
              --draft $pre --title "v$VER — $topic" --notes-file notes.md --verify-tag
          fi
